<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Fleet</title>
<style>
  :root { --bg: #F3F2EF; --card: #ffffff; --text: #1A1918; --muted: #6E6A65; --accent: #5B6EC7; --border: rgba(26, 25, 24, 0.09); color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d0d10; --card: #1b1b20; --text: #e8e8ec; --muted: #8e8e9a; --accent: #6366f1; --border: rgba(255, 255, 255, 0.075); } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; }
  main { max-width: 460px; display: grid; gap: 14px; }
  img { width: 40px; height: 40px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  p { margin: 0; color: var(--muted); }
  code { font: 12px ui-monospace, "SFMono-Regular", Menlo, monospace; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; display: block; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; margin-top: 4px; }
  button { font: inherit; font-size: 13px; font-weight: 500; border-radius: 8px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Fleet didn't start</h1>
  <p id="message">Something went wrong while starting Fleet.</p>
  <p>Its log is here:</p>
  <code id="log"></code>
  <div class="actions">
    <button class="primary" id="retry" type="button">Try again</button>
    <button id="logs" type="button">Open logs</button>
  </div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get("message")) document.getElementById("message").textContent = params.get("message");
  document.getElementById("log").textContent = params.get("log") || "";
  document.getElementById("retry").addEventListener("click", () => window.fleetDesktop?.retry());
  document.getElementById("logs").addEventListener("click", () => window.fleetDesktop?.openLogs());
</script>
</body>
</html>
