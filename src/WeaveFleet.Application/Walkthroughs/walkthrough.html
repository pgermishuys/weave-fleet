<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walkthrough</title>
<!-- Fleet's walkthrough page (fleet_walkthrough_show). Fleet fills #walkthrough-data with the agent's guide and the
     change's hunks; everything below draws from it. -->
<style>
:root{--bg:#0d0d10;--panel:#141418;--card:#1b1b20;--border:rgba(255,255,255,.075);--text:#e8e8ec;--muted:#8e8e9a;--accent:#6366f1;--accent-dim:rgba(99,102,241,.15);
--add:#22c55e;--del:#ef4444;--warn:#f59e0b;--add-bg:rgba(34,197,94,.09);--del-bg:rgba(239,68,68,.09);--add-no:rgba(34,197,94,.14);--del-no:rgba(239,68,68,.14);
--tk-k:#c4a7ff;--tk-s:#9ad7a5;--tk-c:#6f6f7d;--tk-n:#f2b880;
--sans:"Inter Variable","Inter",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono Variable","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:light){:root{--bg:#F3F2EF;--panel:#fff;--card:#fff;--border:rgba(26,25,24,.09);--text:#1A1918;--muted:#6E6A65;--accent:#5B6EC7;--accent-dim:rgba(91,110,199,.12);
--add:#16a34a;--del:#dc2626;--warn:#b45309;--add-bg:rgba(22,163,74,.08);--del-bg:rgba(220,38,38,.07);--add-no:rgba(22,163,74,.13);--del-no:rgba(220,38,38,.12);
--tk-k:#7c3aed;--tk-s:#15803d;--tk-c:#9a958f;--tk-n:#b45309}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
code{overflow-wrap:anywhere;font-family:var(--mono);font-size:.86em;background:var(--accent-dim);padding:1px 5px;border-radius:4px}
a{color:inherit}
.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px}
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:2px}
.tabs button{all:unset;cursor:pointer;padding:4px 12px;border-radius:6px;font-size:13px;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.tabs button:focus-visible,.seg2 button:focus-visible,.ask:focus-visible,.show-more button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.segs{display:flex;gap:3px}.seg{width:22px;height:6px;border-radius:3px;background:var(--border);display:block}
.seg.done{background:var(--add)}.seg.here{box-shadow:0 0 0 1.5px var(--accent)}
main{max-width:1240px;margin:0 auto;padding:28px 24px 80px}
.head h1{font-size:22px;line-height:1.3;margin:0 0 6px;font-weight:600;letter-spacing:-.01em}
.head .meta{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.st-add{color:var(--add)}.st-del{color:var(--del);margin-left:6px}.st-note{color:var(--muted)}
.overview{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;margin:28px 0 12px}
.overview.solo{grid-template-columns:minmax(0,1fr);max-width:760px}
.overview h2,.chapter h2{font-size:16px;margin:0 0 8px;font-weight:600}
.overview p{margin:0 0 12px}
.steps{margin:0;padding-left:20px}.steps li{margin:4px 0}.steps a{text-decoration:none}.steps a:hover{color:var(--accent)}
.diagram{align-self:start;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px 16px}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dhead .cap{font-size:12.5px;color:var(--muted)}
.seg2{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:2px;margin-left:auto}
.seg2 button{all:unset;cursor:pointer;font-size:12px;padding:2px 10px;border-radius:5px;color:var(--muted)}
.seg2 button[aria-pressed=true]{background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.drow{display:flex;align-items:center;gap:8px;margin:8px 0;position:relative}
.drow.branch{padding-left:22px}
.drow.branch::before{content:"";position:absolute;left:8px;top:-6px;bottom:50%;border-left:1.5px solid var(--border);border-bottom:1.5px solid var(--border);width:10px;border-bottom-left-radius:6px}
.dlabel{font-size:11.5px;color:var(--muted);white-space:nowrap;min-width:150px}
.dnodes{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.step{display:inline-flex;align-items:center;gap:6px}
.node{display:inline-flex;max-width:100%;overflow-wrap:anywhere;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:7px;padding:4px 8px;font-size:12.5px}
.node code{background:none;padding:0;font-size:12px}
.node.new{border-color:color-mix(in srgb,var(--add) 45%,transparent);background:color-mix(in srgb,var(--add) 7%,var(--card))}
.node.gone{border-style:dashed;color:var(--muted);text-decoration:line-through}
.plus{color:var(--add);font-family:var(--mono);font-size:12px}
.nnote{font-size:11px;color:var(--muted)}
.badge{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 4px;text-decoration:none}
.badge:hover{color:var(--accent);border-color:var(--accent)}
.arrow{width:14px;height:1.5px;background:var(--muted);position:relative;opacity:.7}
.arrow::after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left:5px solid var(--muted);border-right:0}
.problem{margin-top:12px;font-size:12.5px;color:var(--warn);display:flex;gap:8px}
.problem::before{content:"!";font-weight:700;border:1.5px solid currentColor;border-radius:50%;width:16px;height:16px;display:inline-grid;place-items:center;font-size:10.5px;flex-shrink:0;margin-top:2px}
[hidden]{display:none!important}
.chapter{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:28px;padding:36px 0;border-top:1px solid var(--border)}
.cleft-in{position:sticky;top:76px}
.cnum{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:4px}
.chapter p{margin:0 0 10px;font-size:13.5px}
.cbar{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.reviewed{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.reviewed input{accent-color:var(--add);margin:0}
.ask{all:unset;cursor:pointer;font-size:12px;color:var(--accent)}
.ask:hover{text-decoration:underline}
.chapter.done .cnum,.chapter.done h2{color:var(--muted)}
.chapter.done .reviewed{color:var(--add)}
.cite code{background:none;padding:0;color:var(--muted);font-size:11.5px}
.flist{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--border)}
.flist a{display:flex;gap:8px;align-items:baseline;padding:5px 0;text-decoration:none;font-size:12.5px;border-bottom:1px solid var(--border)}
.flist a:hover .fname{color:var(--accent)}
.fname{font-weight:500;white-space:nowrap}.fdir{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.fstat{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.closer{margin-top:16px;border-left:2px solid var(--warn);padding:2px 0 2px 12px}
.closer-h{font-size:11.5px;font-weight:600;color:var(--warn);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.closer p{font-size:13px}
.file{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.file summary{list-style:none;display:flex;align-items:baseline;gap:8px;padding:8px 12px;cursor:pointer;font-size:12.5px;border-bottom:1px solid transparent}
.file[open] summary{border-bottom-color:var(--border)}
.file summary::-webkit-details-marker{display:none}
.chev{width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);margin-right:2px;transition:transform .15s;align-self:center}
.file[open] .chev{transform:rotate(45deg)}
.tag{font-size:10.5px;color:var(--add);border:1px solid color-mix(in srgb,var(--add) 40%,transparent);border-radius:4px;padding:0 4px}
.tag.del{color:var(--del);border-color:color-mix(in srgb,var(--del) 40%,transparent)}
.scroll{overflow-x:auto}
.diff{border-collapse:collapse;width:100%;font:12px/1.55 var(--mono)}
.diff td{padding:0}
.diff .no{width:1%;min-width:38px;text-align:right;padding:0 8px;color:var(--muted);opacity:.7;user-select:none;white-space:nowrap}
.diff .code{white-space:pre;padding-right:16px}
.sign{display:inline-block;width:18px;text-align:center;color:var(--muted);user-select:none}
.ln.add{background:var(--add-bg)}.ln.add .no{background:var(--add-no)}.ln.add .sign{color:var(--add)}
.ln.del{background:var(--del-bg)}.ln.del .no{background:var(--del-no)}.ln.del .sign{color:var(--del)}
.ln.more{display:none}.file.expanded .ln.more{display:table-row}.file.expanded .show-more{display:none}
.gap td{font:11.5px var(--sans);color:var(--muted);padding:4px 12px;background:color-mix(in srgb,var(--accent) 5%,transparent)}
.gap-ctx{font-family:var(--mono);opacity:.75;margin-left:8px}
.show-more td{padding:6px 12px}.show-more button{all:unset;cursor:pointer;font:12px var(--sans);color:var(--accent)}
.nodiff{padding:10px 12px;font-size:12.5px;color:var(--muted)}
.tk-k{color:var(--tk-k)}.tk-s{color:var(--tk-s)}.tk-c{color:var(--tk-c);font-style:italic}.tk-n{color:var(--tk-n)}
.also{border-top:1px solid var(--border);padding-top:24px;margin-top:4px}
.also h2{font-size:14px;margin:0 0 8px}.also ul{margin:0 0 16px;padding-left:18px;font-size:13px}
.also code{background:none;padding:0}
.flat{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:28px;margin-top:28px}
.flat .flist{position:sticky;top:76px;margin:0;align-self:start}
.hint{font-size:12px;color:var(--muted);margin-top:28px}
.hint kbd{font:11px var(--mono);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (max-width:820px){
  .top-in{padding:8px 14px;gap:10px}.segs{display:none}main{padding:20px 14px 60px}
  .overview,.chapter,.flat{grid-template-columns:minmax(0,1fr);gap:16px}
  .cleft-in,.flat .flist{position:static}
  .dlabel{min-width:0}.drow{flex-direction:column;align-items:flex-start;gap:4px}
  .hint{display:none}
}
</style>
</head>
<body>
<script id="walkthrough-data" type="application/json">{}</script>
<div class="top"><div class="top-in">
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="guide">Walkthrough</button>
    <button role="tab" aria-selected="false" data-tab="files">Files</button>
  </div>
  <div class="progress"><div class="segs" id="segs"></div><span id="count"></span></div>
</div></div>
<main id="main"></main>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("walkthrough-data").textContent);
const G = DATA.guide;
const FILES = DATA.files;
const BY_PATH = new Map(FILES.map((f) => [f.path, f]));
const TOTAL = G.chapters.length;

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const pad2 = (n) => String(n).padStart(2, "0");
const fileName = (p) => p.split("/").pop();
const folderOf = (p) => { const i = p.lastIndexOf("/"); return i < 0 ? "" : p.slice(0, i + 1); };
const fileId = (p) => "f-" + p.replace(/[^a-z0-9]+/gi, "-");

// A little syntax colour: comments, strings, numbers and common keywords.
const KEYWORDS = "abstract|as|async|await|bool|break|case|catch|class|const|continue|def|default|elif|else|enum|export|extends|false|finally|fn|for|foreach|from|func|function|if|impl|import|in|interface|internal|is|let|match|mut|new|nil|None|not|null|out|override|package|private|protected|pub|public|readonly|record|return|sealed|self|static|string|struct|switch|this|throw|true|True|False|try|type|typeof|undefined|using|var|void|while|with|yield";
const TOKEN = new RegExp("(\\/\\/.*$|\\/\\*.*?\\*\\/|<!--.*?-->|\"(?:\\\\.|[^\"\\\\])*\"|'(?:\\\\.|[^'\\\\])*'|`(?:\\\\.|[^`\\\\])*`|\\b(?:" + KEYWORDS + ")\\b|\\b\\d[\\d_]*\\b)", "g");
function colour(code) {
  let out = "", last = 0;
  for (const m of code.matchAll(TOKEN)) {
    out += esc(code.slice(last, m.index));
    const t = m[0];
    const cls = /^(\/\/|\/\*|<!--)/.test(t) ? "c" : /^["'`]/.test(t) ? "s" : /^\d/.test(t) ? "n" : "k";
    out += '<span class="tk-' + cls + '">' + esc(t) + "</span>";
    last = m.index + t.length;
  }
  return out + esc(code.slice(last));
}

function hunks(patch) {
  const list = [];
  let h = null, o = 0, n = 0;
  for (const line of (patch || "").split("\n")) {
    const m = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@ ?(.*)$/.exec(line);
    if (m) {
      h = { newStart: +m[3], newLen: m[4] === undefined ? 1 : +m[4], context: m[5], lines: [] };
      list.push(h); o = +m[1]; n = +m[3];
      continue;
    }
    if (!h || line.startsWith("\\")) continue;
    const t = line[0], body = line.slice(1);
    if (t === "+") h.lines.push({ t: "add", o: null, n: n++, body });
    else if (t === "-") h.lines.push({ t: "del", o: o++, n: null, body });
    else if (t === " ") h.lines.push({ t: "ctx", o: o++, n: n++, body });
  }
  return list;
}

function stat(f) {
  if (!f) return "";
  if (f.binary) return '<span class="st-note">binary</span>';
  return (f.additions ? '<span class="st-add">+' + f.additions + "</span>" : "") + (f.deletions ? '<span class="st-del">−' + f.deletions + "</span>" : "");
}

const SHOW_LINES = 60;
function gapRow(count, context) {
  return '<tr class="gap"><td colspan="3">⋯ ' + count + " unmodified line" + (count === 1 ? "" : "s") + (context ? ' <span class="gap-ctx">' + esc(context.trim()) + "</span>" : "") + "</td></tr>";
}
function fileCard(path, opts) {
  const f = BY_PATH.get(path);
  const tag = f.status === "added" ? '<span class="tag">new</span>' : f.status === "deleted" ? '<span class="tag del">deleted</span>' : "";
  let body;
  if (f.binary || f.tooBig || !f.patch) {
    body = '<div class="nodiff">' + (f.binary ? "A binary file." : f.tooBig ? "Too big to show here." : "No lines to show.") + "</div>";
  } else {
    let rows = "", shown = 0, hidden = 0, prevEnd = null;
    for (const h of hunks(f.patch)) {
      if (prevEnd !== null && h.newStart > prevEnd) rows += gapRow(h.newStart - prevEnd, h.context);
      else if (prevEnd === null && h.newStart > 1) rows += gapRow(h.newStart - 1, h.context);
      for (const l of h.lines) {
        const more = shown >= SHOW_LINES;
        if (more) hidden++;
        shown++;
        rows += '<tr class="ln ' + l.t + (more ? " more" : "") + '"><td class="no">' + (l.o ?? "") + '</td><td class="no">' + (l.n ?? "") + '</td><td class="code"><span class="sign">' + (l.t === "add" ? "+" : l.t === "del" ? "−" : " ") + "</span>" + colour(l.body) + "</td></tr>";
      }
      prevEnd = h.newStart + h.newLen;
    }
    if (hidden) rows += '<tr class="show-more"><td colspan="3"><button type="button" data-more>Show ' + hidden + " more lines</button></td></tr>";
    body = '<div class="scroll"><table class="diff">' + rows + "</table></div>";
  }
  return '<details class="file" id="' + opts.prefix + fileId(path) + '"' + (opts.collapsed ? "" : " open") + '><summary><span class="chev" aria-hidden="true"></span><span class="fname">' + esc(fileName(path)) + '</span><span class="fdir">' + esc(folderOf(path)) + "</span>" + tag + '<span class="fstat">' + stat(f) + "</span></summary>" + body + "</details>";
}
function fileRow(path, target) {
  return '<li><a href="#' + target + '"><span class="fname">' + esc(fileName(path)) + '</span><span class="fdir">' + esc(folderOf(path)) + '</span><span class="fstat">' + stat(BY_PATH.get(path)) + "</span></a></li>";
}

function diagramRows(rows) {
  return rows.map((row) => {
    const nodes = row.nodes.map((n) => {
      const badge = n.chapter ? '<a class="badge" href="#ch-' + n.chapter + '" title="Chapter ' + n.chapter + '">' + pad2(n.chapter) + "</a>" : "";
      const label = n.code ? "<code>" + esc(n.text) + "</code>" : esc(n.text);
      const kind = n.kind === "new" ? " new" : n.kind === "gone" ? " gone" : "";
      return '<span class="node' + kind + '">' + (n.kind === "new" ? '<span class="plus">+</span>' : "") + label + (n.note ? '<span class="nnote">' + esc(n.note) + "</span>" : "") + badge + "</span>";
    }).map((node, i) => (i === 0 ? node : '<span class="step"><span class="arrow" aria-hidden="true"></span>' + node + "</span>")).join("");
    return '<div class="drow' + (row.branch ? " branch" : "") + '">' + (row.label ? '<span class="dlabel">' + esc(row.label) + "</span>" : "") + '<div class="dnodes">' + nodes + "</div></div>";
  }).join("");
}

function render() {
  const totals = FILES.reduce((t, f) => ({ add: t.add + (f.additions || 0), del: t.del + (f.deletions || 0) }), { add: 0, del: 0 });
  const steps = (G.steps || []).map((s) => "<li>" + (s.chapter ? '<a href="#ch-' + s.chapter + '">' + inline(s.text) + "</a>" : inline(s.text)) + "</li>").join("");
  const d = G.diagram;
  const diagram = d ? '<div class="diagram"><div class="dhead"><span class="cap">' + esc(d.caption || "") + "</span>"
      + (d.before ? '<div class="seg2"><button type="button" data-view="before" aria-pressed="false">Before</button><button type="button" data-view="after" aria-pressed="true">After</button></div>' : "")
      + "</div>"
      + (d.before ? '<div data-diagram="before" hidden>' + diagramRows(d.before.rows) + (d.before.problem ? '<div class="problem">' + esc(d.before.problem) + "</div>" : "") + "</div>" : "")
      + '<div data-diagram="after">' + diagramRows(d.after.rows) + "</div></div>" : "";

  const chapters = G.chapters.map((c, i) => {
    const n = i + 1;
    const closer = c.closer && c.closer.length ? '<div class="closer"><div class="closer-h">Worth a closer look</div>' + c.closer.map((q) => "<p>" + inline(q) + "</p>").join("") + "</div>" : "";
    return '<section class="chapter" id="ch-' + n + '" data-ch="' + n + '"><div class="cleft"><div class="cleft-in">'
      + '<div class="cnum">' + pad2(n) + " / " + pad2(TOTAL) + "</div><h2>" + esc(c.title) + "</h2>"
      + '<div class="cbar"><label class="reviewed"><input type="checkbox" data-review="' + n + '"> Reviewed</label>'
      + '<button type="button" class="ask" data-ask="' + n + '">Ask about this</button></div>'
      + c.body.map((p) => "<p>" + inline(p) + "</p>").join("")
      + (c.cite ? '<p class="cite"><code>' + esc(c.cite) + "</code></p>" : "")
      + '<ul class="flist">' + c.files.map((f) => fileRow(f.path, "ch" + n + "-" + fileId(f.path))).join("") + "</ul>" + closer
      + '</div></div><div class="cright">' + c.files.map((f) => fileCard(f.path, { prefix: "ch" + n + "-", collapsed: f.collapsed })).join("") + "</div></section>";
  }).join("");

  const also = (G.alsoChanged || []).map((a) => "<li><code>" + esc(a.path) + "</code>" + (a.note ? ' <span class="muted">' + esc(a.note) + "</span>" : "") + "</li>").join("");
  const left = DATA.uncovered.length ? "<h2>Not in the walkthrough</h2><ul>" + DATA.uncovered.map((p) => '<li><a href="#all-' + fileId(p) + '" data-goto-files><code>' + esc(p) + "</code></a> " + stat(BY_PATH.get(p)) + "</li>").join("") + "</ul>" : "";
  const alsoSection = also || left ? '<section class="also">' + (also ? "<h2>Also changed</h2><ul>" + also + "</ul>" : "") + left + "</section>" : "";

  document.getElementById("main").innerHTML =
    '<header class="head"><h1>' + esc(DATA.title) + '</h1><div class="meta">' + (DATA.comparedWith ? "<span>" + esc(DATA.comparedWith) + "</span>" : "")
    + "<span>" + FILES.length + " file" + (FILES.length === 1 ? "" : "s") + '</span><span><span class="st-add">+' + totals.add + '</span><span class="st-del">−' + totals.del + "</span></span></div></header>"
    + '<div data-panel="guide"><section class="overview' + (diagram ? "" : " solo") + '"><div><h2>Overview</h2><p>' + inline(G.summary) + "</p>" + (steps ? '<ol class="steps">' + steps + "</ol>" : "") + "</div>" + diagram + "</section>"
    + chapters + alsoSection
    + '<p class="hint"><kbd>j</kbd> <kbd>k</kbd> next and previous chapter · <kbd>x</kbd> mark the chapter you\'re on reviewed</p></div>'
    + '<div data-panel="files" hidden><div class="flat"><ul class="flist">' + FILES.map((f) => fileRow(f.path, "all-" + fileId(f.path))).join("") + "</ul><div>"
    + FILES.map((f) => fileCard(f.path, { prefix: "all-", collapsed: false })).join("") + "</div></div></div>";
  document.getElementById("segs").innerHTML = G.chapters.map((c, i) => '<a class="seg" href="#ch-' + (i + 1) + '" data-seg="' + (i + 1) + '" title="' + pad2(i + 1) + " " + esc(c.title) + '"></a>').join("");
}

render();

const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
function setTab(name) {
  $$("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  $$("[data-panel]").forEach((p) => (p.hidden = p.dataset.panel !== name));
}
$$("[data-tab]").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
$$("[data-goto-files]").forEach((a) => a.addEventListener("click", () => setTab("files")));
function setView(v) {
  $$("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  $$("[data-diagram]").forEach((d) => (d.hidden = d.dataset.diagram !== v));
}
$$("[data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
$$("[data-more]").forEach((b) => b.addEventListener("click", () => b.closest(".file").classList.add("expanded")));

// Fleet keeps the page's state (which chapters are reviewed) and puts "Ask about this" in the composer: the page has no
// storage of its own and can't reach Fleet, so it asks the canvas around it. Opened outside Fleet, nothing answers.
const fleet = { on: false };
const toFleet = (message) => { try { window.parent.postMessage(message, "*"); } catch {} };
function reviewedNow() { return $$("[data-review]").filter((b) => b.checked).map((b) => +b.dataset.review); }
function refresh() {
  const done = reviewedNow();
  $$("[data-review]").forEach((box) => {
    const n = box.dataset.review;
    $("#ch-" + n).classList.toggle("done", box.checked);
    $('[data-seg="' + n + '"]').classList.toggle("done", box.checked);
  });
  $("#count").textContent = done.length + " / " + TOTAL + " reviewed";
}
function save() { if (fleet.on) toFleet({ type: "fleet:page-state", state: { reviewed: reviewedNow() } }); }
$$("[data-review]").forEach((box) => box.addEventListener("change", () => {
  refresh(); save();
  if (box.checked) $$("#ch-" + box.dataset.review + " .file[open]").forEach((f) => (f.open = false));
}));
function toast(text) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = text; document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}
$$("[data-ask]").forEach((b) => b.addEventListener("click", () => {
  const c = G.chapters[+b.dataset.ask - 1];
  if (!fleet.on) { toast("Ask in the chat about chapter " + b.dataset.ask + "."); return; }
  toFleet({ type: "fleet:page-reply", text: "About chapter " + b.dataset.ask + " of the walkthrough, “" + c.title + "”: " });
  toast("In the composer. Finish your question and send it.");
}));
window.addEventListener("message", (e) => {
  if (e.source !== window.parent || !e.data || e.data.type !== "fleet:page-state") return;
  fleet.on = true;
  const kept = e.data.state && Array.isArray(e.data.state.reviewed) ? e.data.state.reviewed : [];
  $$("[data-review]").forEach((b) => (b.checked = kept.includes(+b.dataset.review)));
  refresh();
});
toFleet({ type: "fleet:page-hello" });

// The chapter you're on: the last one whose top has passed the bar.
let here = 1;
function track() {
  here = 1;
  $$(".chapter").forEach((c) => { if (c.getBoundingClientRect().top < 120) here = +c.dataset.ch; });
  $$(".seg").forEach((s) => s.classList.toggle("here", +s.dataset.seg === here));
}
addEventListener("scroll", track, { passive: true });
addEventListener("keydown", (e) => {
  if (e.target.closest("input,textarea") || e.metaKey || e.ctrlKey || e.altKey || $('[data-panel="guide"]').hidden) return;
  if (e.key === "j" || e.key === "k") {
    const atTop = scrollY < $("#ch-1").offsetTop - 140;
    const next = e.key === "j" ? (atTop ? 1 : Math.min(TOTAL, here + 1)) : Math.max(1, here - 1);
    $("#ch-" + next).scrollIntoView();
  } else if (e.key === "x") {
    const box = $('[data-review="' + here + '"]');
    box.checked = !box.checked; box.dispatchEvent(new Event("change"));
  }
});
// Stills by address: ?tab=files, ?view=before, ?ch=3, ?reviewed=1,2
const q = new URLSearchParams(location.search);
if (q.get("tab")) setTab(q.get("tab"));
if (q.get("view")) setView(q.get("view"));
(q.get("reviewed") || "").split(",").filter(Boolean).forEach((n) => { const b = $('[data-review="' + n + '"]'); if (b) b.checked = true; });
refresh();
if (q.get("ch")) requestAnimationFrame(() => { document.documentElement.style.scrollBehavior = "auto"; $("#ch-" + q.get("ch")).scrollIntoView(); track(); });
track();
</script>
</body>
</html>
