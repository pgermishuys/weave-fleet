# Fleet workflow, built into Fleet. The format is described in docs/workflows.md.
name: Build a feature
description: >-
  Turns a sentence into a reviewed pull request. It stops once, for you to approve the plan, before any code is
  written. Switch on Design for UI and new features.
placeholder: "What should it build? e.g. Press ? to see every keyboard shortcut"
starts-from: sentence
runs-in: new-worktree
steps:
  - id: design
    title: Design
    agent: build
    model: strong
    skill: fleet-mockups
    optional: For UI and new features
    finish: you
    writes:
      - docs/design/{{slug}}.md
      - docs/design/{{slug}}.html
    prompt: |
      Design {{request}}.
      Write it to docs/design/{{slug}}.md with a mockup next to it in docs/design/{{slug}}.html.
      Don't change any code.
    outcomes: [ready]

  - id: plan
    title: Plan
    agent: plan
    model: strong
    writes:
      - .weave/plans/{{slug}}.md
    prompt: |
      Plan {{request}}.
      Write .weave/plans/{{slug}}.md in Weave's plan format, so Weave's /weave:start can carry it out and Fleet's Progress panel can track it: a title, a TL;DR section of a sentence or two, a Scope section saying what's in and out, then a Tasks section with one "- [ ] N. <title>" line per task, in order, each followed by the files it changes, the tests it adds and how to tell it's done.
      Carry every constraint in the request into the plan, such as what not to install, run or change.
      Reuse what the code already has.
      Read {{previous.files}} first.
      Where the request, the design and the code disagree, choose what changes the least and keep going.
      List each choice under a "Decisions to confirm" heading near the top of the plan: the user reads the plan before approving it.
      Ask a question only if you truly can't go on without the answer.

      {{previous.summary}}
    outcomes: [ready]

  - id: ok-plan
    title: Approve the plan
    you: Build it this way?
    choices:
      Approve: implement
      Send back with a note: { to: plan, note: true }

  - id: implement
    title: Implement
    agent: build
    model: standard
    prompt: |
      The request: {{request}}
      Carry out the tasks in {{steps.plan.files}} in order, including the tests each one names.
      After each task, run its tests, tick it off in the plan ("- [ ]" becomes "- [x]") and commit.

      {{previous.summary}}
    outcomes: [done]

  - id: review
    title: Review
    agent: build
    model: strong
    skill: fleet-code-review
    prompt: |
      The request: {{request}}
      Review this branch against {{run.base}} and {{steps.plan.files}}.
      Use changes only for bugs, or for tests the plan named that are missing.
      Put style nits in the summary and use pass.

      {{previous.summary}}
    outcomes: [pass, changes]
    on: { changes: implement, max: 2 }

  - id: verify
    title: Check it runs
    agent: build
    model: standard
    skill: fleet-run
    optional: For changes you can see
    prompt: |
      The request: {{request}}
      Start the app, try the change the way a person would, and attach screenshots.
    outcomes: [works, broken]
    on: { broken: implement, max: 2 }

  - id: ok-pr
    title: Open the pull request
    you: Push the branch and open a PR?
    choices:
      Open PR: open-pr
      Keep the branch only: end

  - id: open-pr
    title: Push and open the PR
    agent: build
    model: fast
    finish: agent
    prompt: |
      The request: {{request}}
      Push this branch and open a pull request against {{run.base}} with gh pr create.
      Take the title and description from {{steps.plan.files}}, and add what Review found:

      {{steps.review.summary}}

      Put the pull request's URL in summary.
      If you can't push the branch or open the pull request, use failed and put the reason in summary.
    outcomes: [opened, failed]
    on: { failed: end }
