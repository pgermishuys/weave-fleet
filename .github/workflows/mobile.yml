# Fleet's phone app (mobile/): checks, an Android and an iOS build walked through with Maestro against a scratch
# Fleet (screenshots in light and dark as artifacts), and over-the-air updates to EAS from main.
#
# When what runs:
# - Check (tokens, typecheck, tests) runs for every change to the app or to anything in client/src: the typecheck
#   follows the app's imports through the web client's lib, api, composables, stores and components (84 files on
#   14 November 2026), and one new import can pull in any other file there.
# - The walk-throughs run on a pull request only when it can change what the phone draws: mobile/, this workflow, or
#   a shared file the app's bundle loads. Check works that out (mobile/scripts/phone-files.ts follows the app's run-time
#   imports, the way Metro does) and says why in its summary. The same answer gates the EAS update on a push.
# - Every night both walk-throughs run on main, and a red night opens (or comments on) an issue named for the
#   walk-through; a green night closes it. Run the workflow by hand with "nightly" ticked to do the same.
name: Mobile

on:
  pull_request:
    paths: &paths
      - 'mobile/**'
      - 'client/src/**'
      # The typecheck reads the web client's files with the client's own modules.
      - 'client/package.json'
      - 'client/package-lock.json'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main, 'mobile/**']
    paths: *paths
  # 00:37 UTC: in by 02:00 UTC at the latest (03:00 or 04:00 in Amsterdam), off the busy top of the hour.
  schedule:
    - cron: '37 0 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: Run as the nightly (a red walk-through opens or comments on its issue, a green one closes it)
        type: boolean
        default: false

permissions:
  contents: read

# The event is in the group so a push to main can't cancel the night's run.
concurrency:
  group: mobile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same pin as ci.yml; bump both together.
  OPENCODE_VERSION: '1.18.31'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  MAESTRO_CLI_NO_ANALYTICS: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      phone: ${{ steps.reach.outputs.phone }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request checks out its merge commit: the parent is the base it's compared with.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - run: corepack enable
      # The app type-checks and runs the web client's lib files, so it needs the client's modules.
      - name: Client dependencies
        run: corepack npm ci
        working-directory: client
      - name: App dependencies
        run: bun install --frozen-lockfile
        working-directory: mobile
      - name: Tokens match the web client
        run: bun run tokens:check
        working-directory: mobile
      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: mobile
      - name: Tests
        run: bun test src scripts
        working-directory: mobile
      - name: Can this change alter what the phone draws?
        id: reach
        working-directory: mobile
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push)
              if [[ ! "$BEFORE" =~ ^0+$ ]] && git fetch --no-tags --depth=1 origin "$BEFORE"; then base="$BEFORE"; fi ;;
          esac
          if [ -z "$base" ]; then
            echo "phone=true" >> "$GITHUB_OUTPUT"
            echo "### Walk-throughs run: a $EVENT run has nothing to compare with" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          bun scripts/phone-files.ts --changed "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/reaching.txt"
          if [ -s "$RUNNER_TEMP/reaching.txt" ]; then
            echo "phone=true" >> "$GITHUB_OUTPUT"
            { echo "### Walk-throughs run: these files can change what the phone draws"; sed 's/^/- /' "$RUNNER_TEMP/reaching.txt"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "phone=false" >> "$GITHUB_OUTPUT"
            echo "### No walk-throughs: none of the $(wc -l < "$RUNNER_TEMP/changed.txt") changed files is in mobile/ or loaded by the app" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$RUNNER_TEMP/reaching.txt"

  android:
    name: Android walk-through
    needs: check
    # A pull request walks the app when Check says the change can reach the phone; the night's run and a run by hand
    # always do. A push only checks and publishes the update: its pull request walked it, and main walks every night.
    if: github.event_name != 'push' && needs.check.outputs.phone == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLEET_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: App dependencies
        run: bun install --frozen-lockfile
        working-directory: mobile
      # FLEET_E2E=1 builds the walk-through variant (its own JS, no over-the-air updates).
      - name: Generate the Android project
        run: CI=1 bunx expo prebuild -p android
        working-directory: mobile
      # Release bundles the JS and Expo's template signs it with the debug key. x86_64 only: it's what the emulator runs.
      # The Gradle and Kotlin daemons hold gigabytes the emulator and Maestro need for the walk: stop them after.
      - name: Build the APK
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --console=plain
          ./gradlew --stop
        working-directory: mobile/android

      - name: Install OpenCode
        run: |
          for attempt in 1 2 3 4; do
            curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION" --no-modify-path && break
            if [ "$attempt" -eq 4 ]; then echo "OpenCode install failed"; exit 1; fi
            sleep $((attempt * 10))
          done
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Build Fleet
        run: |
          dotnet build src/WeaveFleet.Api -c Debug -p:SkipFrontendBuild=true
          dotnet build-server shutdown
      - name: Start a scratch Fleet
        run: FLEET_E2E_DIR="$RUNNER_TEMP/fleet-e2e" bash mobile/e2e/start-fleet.sh
      - name: Install Maestro
        run: bash mobile/e2e/install-maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator and system image
        # reactivecircus/android-emulator-runner runs sdkmanager itself, but a truncated download only prints
        # "Error on ZipFile unknown archive" (exit 0) and the job dies later with no emulator. Install them here with a
        # retry that checks for that warning (it also appears as "No space left on device"); the action then finds
        # them up to date.
        run: |
          # The build leaves the runner short of disk: on one run the image failed with "No space left on device".
          df -h / | tail -1
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL "$ANDROID_HOME/ndk"
          rm -rf mobile/android/app/.cxx mobile/android/app/build/intermediates mobile/android/build
          df -h / | tail -1
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null || true
          for attempt in 1 2 3 4; do
            out="$("$sdk" --install emulator 'system-images;android-35;google_apis;x86_64' --channel=0 2>&1)" || true
            if ! grep -q "error occurred while preparing" <<< "$out" \
              && [ -x "$ANDROID_HOME/emulator/emulator" ] \
              && [ -f "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/system.img" ]; then break; fi
            echo "$out" | grep -i -E "error|warning: an error" || true
            if [ "$attempt" -eq 4 ]; then echo "Emulator or system image install failed"; exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Walk through the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # The default 2.5 GB is too little for the app, Maestro's driver and Android's own services: the guest's low
          # memory killer runs all through the walk, and in about 1 run in 3 the emulator then drops its adb link and
          # Maestro dies mid-command (6 of 20 runs, then 9 of 18 with 4 cores; 0 of 38 with 4 GB). Cores don't matter.
          ram-size: 4096M
          script: |
            adb reverse tcp:5431 tcp:5431
            adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
            bash mobile/e2e/walk-all.sh android "$RUNNER_TEMP/shots"

      - name: Shots in the summary
        if: always()
        run: |
          drops=$(grep -c 'connection terminated' "$RUNNER_TEMP/shots/adb-server.log" 2>/dev/null || true)
          { echo "### Android screenshots"; echo "adb link drops: ${drops:-0} (any retry of a walk above was for these)"; echo; find "$RUNNER_TEMP/shots" -name "*.png" 2>/dev/null | sed "s|$RUNNER_TEMP/shots/||" | sort | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android-shots
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/fleet-e2e/*.log
          if-no-files-found: warn

  ios:
    name: iOS walk-through
    needs: check
    # A pull request walks the app when Check says the change can reach the phone; the night's run and a run by hand
    # always do. A push only checks and publishes the update: its pull request walked it, and main walks every night.
    if: github.event_name != 'push' && needs.check.outputs.phone == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      FLEET_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: App dependencies
        run: bun install --frozen-lockfile
        working-directory: mobile
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('mobile/bun.lock') }}
          restore-keys: pods-${{ runner.os }}-
      # The pods (RNScreens, Reanimated, SVG, Worklets…) still compile ~570 C++ files from source: ccache keeps them
      # between runs. Keyed on the Xcode build and the lockfile; it's saved right after the build, so a walk that
      # fails later still leaves it for the next run. Xcode runs the compiler without the step's environment, so
      # React Native's wrapper (USE_CCACHE=1) finds no CCACHE_BINARY and runs plain clang: the build gets wrappers that
      # name ccache, its folder and clang by path.
      - name: Install ccache
        id: ccache
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ccache
          export CCACHE_DIR="$HOME/Library/Caches/ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$HOME/ccache-wrap"
          for cc in clang clang++; do
            printf '#!/bin/sh\nexport CCACHE_DIR=%s\nexec %s %s "$@"\n' "$CCACHE_DIR" "$(command -v ccache)" "$(xcrun -f "$cc")" > "$HOME/ccache-wrap/$cc"
            chmod +x "$HOME/ccache-wrap/$cc"
          done
          echo "CCACHE_WRAP=$HOME/ccache-wrap" >> "$GITHUB_ENV"
          xcode=$(xcodebuild -version | awk '/Build version/ {print $3}')
          echo "XCODE_BUILD=$xcode" >> "$GITHUB_ENV"
          prefix="ccache-ios-xcode-$xcode-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${{ hashFiles('mobile/bun.lock') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: ccache-restore
        with:
          path: ~/Library/Caches/ccache
          key: ${{ steps.ccache.outputs.key }}
          restore-keys: ${{ steps.ccache.outputs.prefix }}
      # SDK 58 links precompiled React Native and Expo modules by default (no expo-build-properties needed), which
      # is what the spike's 36 minute build lacked.
      - name: Generate the iOS project
        run: CI=1 bunx expo prebuild -p ios
        working-directory: mobile

      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and x['name'].endswith('Pro')]; print(c[-1]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      # Release, so the JS is bundled; no signing. Only the simulator's own arch: Release builds arm64 and x86_64
      # otherwise, every file twice.
      - name: Build for the simulator
        working-directory: mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1); SCHEME=${WS%.xcworkspace}
          # React Native's ccache settings (scripts/xcode/ccache.conf): Xcode's index store, modules and PCH flags
          # otherwise make every call a miss.
          ccache --set-config sloppiness=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          ccache --set-config depend_mode=true
          ccache --set-config file_clone=true
          # Runners roll between images that carry the same Xcode with different file times, and ccache's default
          # check (the compiler's mtime) then misses every call: the Xcode build names the compiler instead.
          ccache --set-config compiler_check="string:$XCODE_BUILD"
          ccache -z > /dev/null
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build ONLY_ACTIVE_ARCH=YES \
            CC="$CCACHE_WRAP/clang" CXX="$CCACHE_WRAP/clang++" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|\*\* BUILD" || true
          ccache -s
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcodebuild.log"
          echo "APP=$PWD/$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)" >> "$GITHUB_ENV"
      - uses: actions/cache/save@v4
        if: steps.ccache-restore.outputs.cache-hit != 'true'
        with:
          path: ~/Library/Caches/ccache
          key: ${{ steps.ccache.outputs.key }}
      - name: Install the app
        run: xcrun simctl install "$UDID" "$APP"

      - name: Install OpenCode
        run: |
          for attempt in 1 2 3 4; do
            curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION" --no-modify-path && break
            if [ "$attempt" -eq 4 ]; then echo "OpenCode install failed"; exit 1; fi
            sleep $((attempt * 10))
          done
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Build Fleet
        run: dotnet build src/WeaveFleet.Api -c Debug -p:SkipFrontendBuild=true
      - name: Start a scratch Fleet
        run: FLEET_E2E_DIR="$RUNNER_TEMP/fleet-e2e" bash mobile/e2e/start-fleet.sh
      - name: Install Maestro
        run: bash mobile/e2e/install-maestro.sh

      - name: Walk through the app
        run: bash mobile/e2e/walk-all.sh ios "$RUNNER_TEMP/shots" "$UDID"

      - name: Shots in the summary
        if: always()
        run: |
          { echo "### iOS screenshots"; find "$RUNNER_TEMP/shots" -name "*.png" 2>/dev/null | sed "s|$RUNNER_TEMP/shots/||" | sort | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ios-shots
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/fleet-e2e/*.log
          if-no-files-found: warn

  eas-update:
    name: EAS update
    needs: check
    if: github.event_name == 'push' && needs.check.outputs.phone == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Skip without an Expo token
        id: gate
        run: |
          if [ -n "$EXPO_TOKEN" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "No EXPO_TOKEN secret; skipping."; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.go == 'true'
      - uses: expo/expo-github-action@v8
        if: steps.gate.outputs.go == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: App dependencies
        if: steps.gate.outputs.go == 'true'
        run: bun install --frozen-lockfile
        working-directory: mobile
      - name: Publish
        if: steps.gate.outputs.go == 'true'
        working-directory: mobile
        env:
          SHA: ${{ github.sha }}
        run: |
          msg="${SHA::7} $(git log -1 --format=%s)"
          for channel in preview development; do
            bunx eas-cli update --channel "$channel" --message "$msg" --non-interactive
          done

  # Until a daily retro owns a red night, the night's run reports it here: one open issue per walk-through that isn't
  # green, a comment on it each night it stays red, closed on the first green night. Only the run's link, commit and
  # result go in it, never anything from the walk.
  nightly-report:
    name: Nightly report
    needs: [check, android, ios]
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
      REF: ${{ github.ref_name }}
      CHECK: ${{ needs.check.result }}
      ANDROID: ${{ needs.android.result }}
      IOS: ${{ needs.ios.result }}
    steps:
      - name: Open, comment on or close the walk-through issues
        run: |
          set -euo pipefail
          report() {
            local walk="$1" result="$2" artifact="$3"
            local title="Nightly $walk walk-through failed"
            local open
            open=$(gh issue list --state open --limit 500 --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ "$result" = success ]; then
              if [ -n "$open" ]; then
                gh issue close "$open" --comment "Green again on \`$REF\` at ${SHA::7}: $RUN_URL"
                echo "$walk: green, closed #$open"
              else
                echo "$walk: green"
              fi
              return
            fi
            local why="it ended \`$result\`" files="
          Screenshots and logs: the run's \`$artifact\` artifact."
            if [ "$result" = skipped ]; then why="it didn't run, because Check ended \`$CHECK\`"; files=""; fi
            local text="The nightly $walk walk-through of \`$REF\` at ${SHA::7} is red: $why.

          Run: $RUN_URL$files

          This issue closes itself after the next green night."
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$text"
              echo "$walk: red ($result), commented on #$open"
            else
              gh issue create --title "$title" --body "$text"
              echo "$walk: red ($result), opened an issue"
            fi
          }
          report Android "$ANDROID" mobile-android-shots
          report iOS "$IOS" mobile-ios-shots
