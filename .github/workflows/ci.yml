name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.weave/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.weave/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── .NET unit tests ──────────────────────────────────────────────────────
  # The one build that runs every analyzer (code style, trimming), so those problems still fail CI. The other
  # .NET jobs build with -p:RunAnalyzers=false.
  unit:
    name: .NET Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build solution
        run: dotnet build WeaveFleet.slnx --configuration Release -p:SkipFrontendBuild=true

      # The live IntegrationTests run in the Live job; this keeps the E2E project's non-E2E test (WebPushTests,
      # Category=PushE2E) here. `--logger trx` gives each test project its own results file.
      - name: Run .NET unit tests
        run: >
          dotnet test WeaveFleet.slnx
          --configuration Release
          --filter "Category!=E2E&Category!=HarnessSmoke&Category!=ModHostLive&FullyQualifiedName!~WeaveFleet.IntegrationTests."
          --logger trx
          --results-directory test-results/
          --no-build
          -p:SkipFrontendBuild=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-unit-test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Report unit test results
        if: success() || failure()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Test Results
          path: test-results/**/*.trx
          reporter: dotnet-trx

  # ── .NET live tests (real OpenCode / OpenCode 2) ─────────────────────────
  live:
    name: .NET Live Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The live tests' pinned harness versions (see the install steps). Bump here and check the live tests pass.
      OPENCODE_VERSION: '1.18.31'
      OPENCODE2_VERSION: '2.1.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The [OpenCodeFact] live tests run a real opencode against a scripted model. Pinned, so a new
      # OpenCode release can't break CI unannounced: bump the version here and check the live tests pass.
      - name: Cache OpenCode
        id: opencode-cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode
          key: opencode-${{ runner.os }}-${{ env.OPENCODE_VERSION }}

      # The download now and then fails ("Version ... is not available"): try a few times before giving up.
      - name: Install OpenCode
        if: steps.opencode-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4; do
            curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION" --no-modify-path && break
            if [ "$attempt" -eq 4 ]; then echo "OpenCode install failed after $attempt attempts"; exit 1; fi
            echo "OpenCode install attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

      - name: Add OpenCode to PATH
        run: |
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      # The [OpenCode2Fact] live tests and the OpenCode 2 conformance tests run a real OpenCode 2. Pinned the same
      # way: bump the version here and check both pass. With OpenCode 1 installed, Fleet sets V2 up in separate mode
      # (its installer with HOME=~/.weave/harnesses/opencode2), since V2's installer would overwrite
      # ~/.opencode/bin/opencode; CI installs it the same way, and the harness finds it there. The installer adds its
      # folder to GITHUB_PATH when GITHUB_ACTIONS is set, which would put V2's `opencode` ahead of OpenCode 1's in
      # later steps, so it runs without that variable.
      - name: Install OpenCode 2
        run: |
          # Downloaded first: piped, a failed download runs an empty script and the step passes.
          # The installer downloads the package itself and fails transiently ("Failed to fetch package information",
          # "Connection reset by peer"), so the whole download-and-install retries with backoff, like OpenCode 1 above.
          # Each attempt starts from an empty install home so a partial install can't poison the next one.
          opencode2_home="$HOME/.weave/harnesses/opencode2"
          for attempt in 1 2 3 4; do
            rm -rf "$opencode2_home" "$RUNNER_TEMP/opencode2-install.sh"
            mkdir -p "$opencode2_home"
            if curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/opencode2-install.sh" https://opencode.ai/v2/install \
              && env -u GITHUB_ACTIONS HOME="$opencode2_home" bash "$RUNNER_TEMP/opencode2-install.sh" --version "$OPENCODE2_VERSION" --no-modify-path; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then echo "OpenCode 2 install failed after $attempt attempts"; exit 1; fi
            echo "OpenCode 2 install attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

      - name: Check OpenCode versions
        run: |
          opencode2="$HOME/.weave/harnesses/opencode2/.opencode/bin/opencode2"
          echo "opencode:  $(command -v opencode) -> $(opencode --version)"
          echo "opencode2: $opencode2 -> $("$opencode2" --version)"
          opencode --version | grep -qF "$OPENCODE_VERSION" || { echo "::error::opencode on PATH isn't OpenCode $OPENCODE_VERSION."; exit 1; }
          "$opencode2" --version | grep -qF "$OPENCODE2_VERSION" || { echo "::error::The separate OpenCode 2 isn't $OPENCODE2_VERSION."; exit 1; }

      # Builds only what this job runs, without analyzers (the Unit job already runs them).
      - name: Build live tests
        run: |
          dotnet build tests/WeaveFleet.IntegrationTests --configuration Release -p:SkipFrontendBuild=true -p:RunAnalyzers=false
          dotnet build tests/WeaveFleet.ConformanceTests --configuration Release -p:SkipFrontendBuild=true -p:RunAnalyzers=false

      - name: Run live tests
        run: >
          dotnet test tests/WeaveFleet.IntegrationTests
          --configuration Release
          --filter "Category!=E2E&Category!=HarnessSmoke&Category!=ModHostLive"
          --logger trx
          --results-directory test-results/
          --no-build
          -p:SkipFrontendBuild=true
        env:
          # A missing opencode or opencode2 fails the live tests instead of skipping them.
          FLEET_REQUIRE_OPENCODE: '1'
          FLEET_REQUIRE_OPENCODE2: '1'

      # The conformance project runs its own xUnit runner (dotnet test skips it). Only OpenCode 2's fixture runs here:
      # OpenCode 1's starts opencode with the runner's own HOME and was never wired into CI.
      - name: Run OpenCode 2 conformance tests
        run: >
          dotnet exec tests/WeaveFleet.ConformanceTests/bin/Release/net10.0/WeaveFleet.ConformanceTests.dll
          -trait "Harness=opencode2"
          -trx test-results/conformance-opencode2.trx
        env:
          FLEET_REQUIRE_OPENCODE2: '1'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-live-test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Report live test results
        if: success() || failure()
        uses: dorny/test-reporter@v1
        with:
          name: Live Test Results
          path: test-results/**/*.trx
          reporter: dotnet-trx

  # ── Frontend checks (lint, typecheck, unit tests) ────────────────────────
  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Enable Corepack npm
        run: corepack enable

      - name: Install dependencies
        run: corepack npm ci
        working-directory: client

      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Typecheck
        run: npm run typecheck
        working-directory: client

      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile=test-results/client-results.xml
        working-directory: client

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-results-${{ github.run_id }}
          path: client/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Report client test results
        if: success() || failure()
        uses: dorny/test-reporter@v1
        with:
          name: Client Test Results
          path: client/test-results/**/*.xml
          reporter: java-junit

  # ── Mod host (mods/host: Bun + TypeScript) ───────────────────────────────
  mods-host:
    name: Mod host
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to the Bun Fleet downloads for mods (BunRuntimeInstaller), so the host is tested on the runtime it ships with.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: mods/host

      - name: Typecheck
        run: bun run typecheck
        working-directory: mods/host

      - name: Unit and end-to-end tests
        run: bun test
        working-directory: mods/host

      - name: Build dist/host.js
        run: bun run build && test -s dist/host.js
        working-directory: mods/host

      # Fleet's side of the pipe (ModHostClient, the supervisor) against the dist/host.js just built, on the same Bun.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fleet against the real host
        shell: bash
        run: >
          dotnet test tests/WeaveFleet.Infrastructure.Tests
          --configuration Release
          --filter "Category=ModHostLive"
          --logger "trx;LogFileName=mods-host-live.trx"
          --results-directory test-results/
          -p:SkipFrontendBuild=true
          -p:SkipModsHost=true
        env:
          # A missing Bun or host.js fails these tests instead of letting them return early.
          FLEET_MODS_LIVE: '1'

      # dotnet test exits 0 when nothing runs.
      - name: Fail if no live test ran
        shell: bash
        run: |
          total=$(grep -ho '<Counters total="[0-9]*"' test-results/mods-host-live.trx | grep -o '[0-9]*' || echo 0)
          echo "Tests run: ${total}"
          if [ "${total:-0}" -eq 0 ]; then
            echo "::error::The live mod host tests didn't run."
            exit 1
          fi

  # ── fleet launchers (bin/fleet, bin/fleet.cmd) ───────────────────────────
  launchers:
    name: Launchers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test launcher.sh
        if: runner.os != 'Windows'
        run: sh scripts/test-launchers.sh

      - name: Test add-unversioned-installers.sh
        if: runner.os != 'Windows'
        run: bash scripts/test-unversioned-installers.sh

      - name: Test launcher.cmd
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-launchers.ps1

  # ── Windows-only process tests ───────────────────────────────────────────
  # The other .NET tests run on Linux only. A process the agent leaves running must outlive an idle stop and end
  # with the session's Job Object, which only Windows has. The mod runtime tests run here too: Fleet starts bun.exe
  # with a cleared environment, which only a real Windows start can prove.
  windows-processes:
    name: Windows processes
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Also the mod store's file-safety tests, for SafeFile's Windows path (attributes, no FIFOs).
      - name: Run the leftover-process, file-safety and mod runtime tests
        shell: bash
        env:
          FLEET_TEST_REAL_BUN: ${{ steps.bun.outputs.bun-path }}
        run: >
          dotnet test tests/WeaveFleet.Infrastructure.Tests
          --configuration Release
          --filter "FullyQualifiedName~ClaudeCodeProcessManagerTests.What_the_agent_left_running|Category=ModsFileSafety|FullyQualifiedName~Runtimes"
          --logger "trx;LogFileName=windows-processes.trx"
          --results-directory test-results/
          -p:SkipFrontendBuild=true

      # dotnet test exits 0 when nothing runs.
      - name: Fail if no test ran
        shell: bash
        run: |
          total=$(grep -ho '<Counters total="[0-9]*"' test-results/windows-processes.trx | grep -o '[0-9]*' || echo 0)
          echo "Tests run: ${total}"
          if [ "${total:-0}" -eq 0 ]; then
            echo "::error::The leftover-process and mod runtime tests didn't run."
            exit 1
          fi

  # The mod store opens and stats every file of a mod natively (SafeFile: open with O_NONBLOCK | O_NOFOLLOW, then
  # fstat), and the open flags differ by OS and CPU. The other .NET tests run on Linux x64 only, so these few run on
  # each other Unix Fleet's code has a path for. Fleet ships macOS for Apple silicon only (osx-arm64 in release.yml),
  # so Intel Mac isn't tested.
  mods-file-safety:
    name: Mod file safety (${{ matrix.runs_on }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runs_on: [macos-latest, ubuntu-24.04-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A pinned real Bun, so the Bun probe tests run through CheckAsync (and the stat helper) on every platform.
      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Run the mod store's file-safety tests
        shell: bash
        env:
          FLEET_TEST_REAL_BUN: ${{ steps.bun.outputs.bun-path }}
        run: >
          dotnet test tests/WeaveFleet.Infrastructure.Tests
          --configuration Release
          --filter "Category=ModsFileSafety"
          --logger "trx;LogFileName=mods-file-safety.trx"
          --results-directory test-results/
          -p:SkipFrontendBuild=true

      # dotnet test exits 0 when nothing runs.
      - name: Fail if no test ran
        shell: bash
        run: |
          total=$(grep -ho '<Counters total="[0-9]*"' test-results/mods-file-safety.trx | grep -o '[0-9]*' || echo 0)
          echo "Tests run: ${total}"
          if [ "${total:-0}" -eq 0 ]; then
            echo "::error::The mod file-safety tests didn't run."
            exit 1
          fi

  # ── Desktop app ──────────────────────────────────────────────────────────
  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: desktop
        env:
          # Type checks and unit tests don't run Electron.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Type check
        run: bun run typecheck
        working-directory: desktop

      - name: Unit tests
        run: bunx vitest run
        working-directory: desktop

  # ── Playwright E2E ───────────────────────────────────────────────────────
  # Builds and tests in one job so the E2E project's packages come from its own
  # restore, not from a NuGet cache another job saved.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: client

      - name: Build frontend SPA
        run: bun run build
        working-directory: client

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The Unit job runs the analyzers.
      - name: Build E2E tests
        run: dotnet build tests/WeaveFleet.E2E --configuration Release -p:RunAnalyzers=false

      - name: Get installed Playwright version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path "Directory.Packages.props" -XPath "//PackageVersion[@Include='Microsoft.Playwright']/@Version").Node.Value
          "PLAYWRIGHT_VERSION=$version" >> $env:GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pwsh tests/WeaveFleet.E2E/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Install Playwright OS dependencies
        run: pwsh tests/WeaveFleet.E2E/bin/Release/net10.0/playwright.ps1 install-deps chromium

      - name: Trust dev certs
        run: |
          dotnet dev-certs https --clean
          dotnet dev-certs https --trust || [ $? -eq 4 ]
          DEV_CERTS_TRUST="$HOME/.aspnet/dev-certs/trust"
          EXISTING="${SSL_CERT_DIR:-/usr/lib/ssl/certs}"
          echo "SSL_CERT_DIR=${DEV_CERTS_TRUST}:${EXISTING}" >> $GITHUB_ENV

      - name: Run E2E tests
        run: >
          dotnet test tests/WeaveFleet.E2E/
          --configuration Release
          --filter "Category=E2E"
          --logger "trx;LogFileName=e2e-results.trx"
          --results-directory test-results/
          --no-build
          -p:SkipFrontendBuild=true
        env:
          ASPNETCORE_ENVIRONMENT: Test

      # dotnet test exits 0 when nothing runs, which hid a month of skipped E2E runs.
      - name: Fail if no E2E tests ran
        run: |
          total=$(grep -ho '<Counters total="[0-9]*"' test-results/e2e-results.trx | grep -o '[0-9]*' || echo 0)
          echo "E2E tests run: ${total}"
          if [ "${total:-0}" -eq 0 ]; then
            echo "::error::No E2E tests ran."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ github.run_id }}
          path: |
            test-results/
            tests/WeaveFleet.E2E/bin/Release/net10.0/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Report E2E test results
        if: success() || failure()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Results
          path: test-results/**/*.trx
          reporter: dotnet-trx

  # ── AOT publish validation ────────────────────────────────────────────────
  aot:
    name: AOT Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-aot-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-aot-${{ runner.os }}-

      # Pinned to the Bun Fleet downloads for mods (BunRuntimeInstaller), same as the mod host job.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Build mod host
        run: |
          bun install --frozen-lockfile
          bun run build
          test -s dist/host.js
        working-directory: mods/host

      # The Unit job runs the analyzers; ILC still fails the publish on trim and AOT warnings
      # (IlcTreatWarningsAsErrors follows TreatWarningsAsErrors).
      - name: AOT publish (linux-x64)
        run: |
          dotnet publish src/WeaveFleet.Api/WeaveFleet.Api.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --output artifacts/publish/linux-x64 \
            -p:RunAnalyzers=false \
            -p:SkipFrontendBuild=true

      - name: Check the publish output and package have the mod host
        shell: bash
        run: |
          test -s artifacts/publish/linux-x64/mods-host/host.js
          package_dir="$(mktemp -d)"
          bash ./scripts/package.sh \
            --publish-dir artifacts/publish/linux-x64 \
            --rid linux-x64 \
            --output-dir "$package_dir" \
            --version 0.0.0-ci
          # The listing goes to a file first: grep -q stops reading at its match, and tar's write error would fail the pipe.
          tar -tzf "$package_dir/fleet-v0.0.0-ci-linux-x64.tar.gz" > "$package_dir/listing.txt"
          grep -qx "fleet-v0.0.0-ci-linux-x64/app/mods-host/host.js" "$package_dir/listing.txt"

      - name: Smoke test AOT binary
        shell: bash
        run: |
          binary="artifacts/publish/linux-x64/WeaveFleet.Api"
          chmod +x "$binary"
          port="5010"
          log_path="/tmp/fleet-smoke.log"

          # Workflows on, so the smoke test can read the built-in workflow through the AOT build's YAML parser.
          Fleet__Host="127.0.0.1" Fleet__Port="$port" Fleet__Harness__Workflows="true" "$binary" >"$log_path" 2>&1 &
          app_pid=$!

          cleanup() { kill "$app_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/healthz" >/dev/null; then
              echo "AOT smoke test: healthz responded OK."
              # The built-in workflow is YAML read at run time; a trimmed-away parser shows up here, not in healthz.
              workflows=$(curl -fsS "http://127.0.0.1:${port}/api/workflows" || true)
              if ! echo "$workflows" | grep -q '"name":"Build a feature"' || ! echo "$workflows" | grep -q '"id":"open-pr"' || echo "$workflows" | grep -q '"errors":\["'; then
                echo "::error::The AOT build didn't read the built-in workflow: $workflows"
                cat "$log_path"
                exit 1
              fi
              echo "AOT smoke test passed — healthz responded OK and the built-in workflow reads."
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
              trap - EXIT
              exit 0
            fi

            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::AOT binary crashed during startup"
              cat "$log_path"
              exit 1
            fi

            sleep 1
          done

          echo "::error::AOT binary did not become healthy within 30s"
          cat "$log_path"
          exit 1
