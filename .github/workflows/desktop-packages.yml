name: Desktop packages

# Builds the desktop app's installers with the AOT Fleet server inside, and smoke-tests each packaged app: it has to
# start its bundled Fleet, serve the UI, and take Fleet down with it when it's killed. Runs on pull requests that
# touch the app, and by hand (artifacts only, nothing is released). The Release workflow doesn't call it: each of its
# build jobs packages the app from the server it has just built and smoke-tested, with the same steps
# (.github/actions/package-desktop). The latest*.yml files are the app's update feed.

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-packages.yml'
      - '.github/actions/package-desktop/**'
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the packages
        required: false
        default: 0.0.0-dev

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Desktop ${{ matrix.rid }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runs_on: ubuntu-latest
            builder_args: --linux --x64
            app: release/linux-unpacked/fleet-desktop
            installers: |
              desktop/release/Fleet-*.AppImage
              desktop/release/Fleet-*.deb
          - rid: osx-arm64
            runs_on: macos-15
            builder_args: --mac --arm64
            app: release/mac-arm64/Fleet.app/Contents/MacOS/Fleet
            installers: |
              desktop/release/Fleet-*.dmg
              desktop/release/Fleet-*.zip
          - rid: win-x64
            runs_on: windows-latest
            builder_args: --win --x64
            app: release/win-unpacked/Fleet.exe
            installers: |
              desktop/release/Fleet-*-setup.exe
          - rid: win-arm64
            runs_on: windows-latest
            builder_args: --win --arm64
            cross_compile: true
            installers: |
              desktop/release/Fleet-*-setup.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-0.0.0-pr.${{ github.event.pull_request.number || 0 }}}"
          echo "VERSION=${version#v}" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The Bun Fleet runs mods on (BunRelease.Pinned), as in CI, so the host.js shipped is built by the Bun it runs on.
          bun-version-file: .bun-version

      - name: Build Vue client
        shell: bash
        working-directory: client
        run: |
          corepack enable
          corepack npm ci
          npm run build

      - name: Select Xcode 16.2
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Build mod host
        shell: bash
        working-directory: mods/host
        run: |
          bun install --frozen-lockfile
          bun run build
          test -s dist/host.js

      - name: Publish AOT server
        shell: bash
        run: |
          dotnet publish src/WeaveFleet.Api/WeaveFleet.Api.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --output "${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}"

      - name: Package, check and upload the desktop app
        uses: ./.github/actions/package-desktop
        with:
          rid: ${{ matrix.rid }}
          builder-args: ${{ matrix.builder_args }}
          app: ${{ matrix.app }}
          installers: ${{ matrix.installers }}
          version: ${{ env.VERSION }}
          server-dir: ${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}
