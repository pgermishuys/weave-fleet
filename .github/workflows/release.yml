name: Release

# A pushed v* tag builds, checks and publishes a release. Run by hand (workflow_dispatch) it's a dry run: it builds,
# packages and smoke-tests everything the same way and assembles the release, then compares it with the latest real
# release instead of publishing. Every step that publishes runs only for a pushed v* tag (see `if:` on each).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the dry run's packages (default: the one in Directory.Build.props)"
        required: false
        default: ''
      compare_with:
        description: "Published release to compare the dry run with (default: the latest)"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is built or published unless the tag is the commit's version, the commit is on main, and CI (ci.yml) passed
  # on it. The release commit is usually tagged as soon as it's pushed, so this waits for its CI run (about 8 minutes)
  # and blocks on a red, cancelled or missing one, saying how to recover. See RELEASE.md and scripts/release-ci-gate.sh.
  ci-gate:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            .github/workflows

      # A tag push releases its tag. A dry run stamps the version asked for, or the one in Directory.Build.props.
      - name: Resolve the version
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"
          else
            version="${INPUT_VERSION:-$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)}"
            tag="v${version#v}"
            echo "::notice::Dry run of ${tag}: nothing is published."
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::'$tag' isn't a version tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test the gate
        run: bash scripts/test-release-ci-gate.sh

      # A real tag push also checks the tag is Directory.Build.props' version and the commit is on main. A dry run by
      # hand on a branch skips both (and its summary says so).
      - name: Check the tag, then wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GATE_CHECK_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: bash scripts/release-ci-gate.sh HEAD "${{ steps.version.outputs.tag }}"

  # One job per platform compiles the AOT server once, packages and smoke-tests the CLI archive, then packages the
  # desktop app around that same server folder and checks it ships it byte for byte. The CLI archive is uploaded
  # before the desktop packaging starts, so a desktop failure never loses it. If anything after the compile fails, the
  # job keeps the server as an artifact, and re-running the failed job reuses it instead of compiling again.
  build:
    name: Build ${{ matrix.rid }}
    needs: ci-gate
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runs_on: ubuntu-latest
            archive_extension: .tar.gz
            builder_args: --linux --x64
            app: release/linux-unpacked/fleet-desktop
            installers: |
              desktop/release/Fleet-*.AppImage
              desktop/release/Fleet-*.deb
          - rid: osx-arm64
            runs_on: macos-15
            archive_extension: .tar.gz
            builder_args: --mac --arm64
            app: release/mac-arm64/Fleet.app/Contents/MacOS/Fleet
            installers: |
              desktop/release/Fleet-*.dmg
              desktop/release/Fleet-*.zip
          - rid: win-x64
            runs_on: windows-latest
            archive_extension: .zip
            builder_args: --win --x64
            app: release/win-unpacked/Fleet.exe
            installers: |
              desktop/release/Fleet-*-setup.exe
          - rid: win-arm64
            runs_on: windows-latest
            archive_extension: .zip
            cross_compile: true
            builder_args: --win --arm64
            installers: |
              desktop/release/Fleet-*-setup.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only on a re-run: the server an earlier attempt of this job compiled, kept because a later step failed.
      - name: Reuse the server an earlier attempt built
        id: reuse
        if: github.run_attempt != '1'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: server-${{ matrix.rid }}
          path: artifacts/reuse

      - name: Unpack the reused server
        if: steps.reuse.outcome == 'success'
        shell: bash
        run: |
          mkdir -p "artifacts/publish/${{ matrix.rid }}"
          tar -xf artifacts/reuse/server.tar -C "artifacts/publish/${{ matrix.rid }}"
          echo "::notice::Reusing the server compiled by an earlier attempt of this run; not compiling again."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Enable Corepack npm
        run: corepack enable

      - name: Install client dependencies
        if: steps.reuse.outcome != 'success'
        run: corepack npm ci
        working-directory: client

      - name: Build Vue client
        if: steps.reuse.outcome != 'success'
        run: npm run build
        working-directory: client

      # Pinned to the Bun Fleet downloads for mods (BunRuntimeInstaller), same as the CI mod host job.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Build mod host
        if: steps.reuse.outcome != 'success'
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run build
          test -s dist/host.js
        working-directory: mods/host

      - name: Select Xcode 16.2
        if: runner.os == 'macOS' && steps.reuse.outcome != 'success'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Publish AOT app
        id: publish
        if: steps.reuse.outcome != 'success'
        shell: bash
        run: |
          dotnet publish src/WeaveFleet.Api/WeaveFleet.Api.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --output "${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}"

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.ci-gate.outputs.tag }}
        run: |
          package_version="${RELEASE_TAG#v}"
          bash ./scripts/package.sh \
            --publish-dir "${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}" \
            --rid "${{ matrix.rid }}" \
            --output-dir "${{ github.workspace }}/artifacts/release" \
            --version "$package_version"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.ci-gate.outputs.tag }}
        run: |
          $packageVersion = $env:RELEASE_TAG.TrimStart('v')
          ./scripts/package.ps1 `
            -PublishDir "${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}" `
            -Rid "${{ matrix.rid }}" `
            -OutputDir "${{ github.workspace }}/artifacts/release" `
            -Version $packageVersion

      - name: Check the Unix package has the mod host
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.ci-gate.outputs.tag }}
        run: |
          asset_base_name="fleet-${RELEASE_TAG}-${{ matrix.rid }}"
          archive_path="${{ github.workspace }}/artifacts/release/${asset_base_name}${{ matrix.archive_extension }}"

          # The listing is read whole first: grep -q stops reading at its match, and tar's write error would fail the pipe.
          listing="$(tar -tzf "$archive_path")"
          if ! grep -qx "${asset_base_name}/app/mods-host/host.js" <<<"$listing"; then
            echo "::error::${archive_path} has no app/mods-host/host.js"
            exit 1
          fi

      - name: Check the Windows package has the mod host
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.ci-gate.outputs.tag }}
        run: |
          $assetBaseName = "fleet-$($env:RELEASE_TAG)-${{ matrix.rid }}"
          $archivePath = Join-Path $env:GITHUB_WORKSPACE "artifacts/release/$assetBaseName${{ matrix.archive_extension }}"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
              $entry = $zip.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq "$assetBaseName/app/mods-host/host.js" }
              if (-not $entry) {
                  throw "$archivePath has no app/mods-host/host.js"
              }
          }
          finally {
              $zip.Dispose()
          }

      - name: Smoke test Unix package
        if: runner.os != 'Windows' && !matrix.cross_compile
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.ci-gate.outputs.tag }}
        run: |
          package_version="${RELEASE_TAG#v}"
          asset_base_name="fleet-${RELEASE_TAG}-${{ matrix.rid }}"
          asset_name="${asset_base_name}${{ matrix.archive_extension }}"
          archive_path="${{ github.workspace }}/artifacts/release/${asset_name}"
          extract_dir="${{ runner.temp }}/smoke-${{ matrix.rid }}"
          log_path="$extract_dir/fleet.log"
          port="5010"

          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xzf "$archive_path" -C "$extract_dir"

          test -d "$extract_dir/$asset_base_name/app"
          test -d "$extract_dir/$asset_base_name/bin"
          test -f "$extract_dir/$asset_base_name/VERSION"
          test -f "$extract_dir/$asset_base_name/app/mods-host/host.js"

          version_output="$($extract_dir/$asset_base_name/bin/fleet version)"
          test "$version_output" = "$package_version"

          WEAVE_FLEET_HOST="127.0.0.1" WEAVE_FLEET_PORT="$port" "$extract_dir/$asset_base_name/bin/fleet" >"$log_path" 2>&1 &
          app_pid=$!

          cleanup() {
            kill "$app_pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/healthz" >/dev/null; then
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
              trap - EXIT
              exit 0
            fi

            if ! kill -0 "$app_pid" 2>/dev/null; then
              if [ -f "$log_path" ]; then
                cat "$log_path"
              fi

              exit 1
            fi

            sleep 1
          done

          if [ -f "$log_path" ]; then
            cat "$log_path"
          fi

          exit 1

      - name: Smoke test Windows package
        if: runner.os == 'Windows' && !matrix.cross_compile
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.ci-gate.outputs.tag }}
        run: |
          $packageVersion = $env:RELEASE_TAG.TrimStart('v')
          $assetBaseName = "fleet-$($env:RELEASE_TAG)-${{ matrix.rid }}"
          $assetName = "$assetBaseName${{ matrix.archive_extension }}"
          $archivePath = Join-Path $env:GITHUB_WORKSPACE "artifacts/release/$assetName"
          $extractDir = Join-Path $env:RUNNER_TEMP "smoke-${{ matrix.rid }}"
          $logPath = Join-Path $extractDir 'fleet.log'
          $errorLogPath = Join-Path $extractDir 'fleet.err.log'
          $port = '5010'

          if (Test-Path -LiteralPath $extractDir) {
              Remove-Item -Recurse -Force -Path $extractDir
          }

          $null = New-Item -ItemType Directory -Path $extractDir -Force
          Expand-Archive -Path $archivePath -DestinationPath $extractDir -Force

          $packageDir = Join-Path $extractDir $assetBaseName
          if (-not (Test-Path -LiteralPath (Join-Path $packageDir 'app') -PathType Container)) {
              throw 'Missing packaged app directory.'
          }

          if (-not (Test-Path -LiteralPath (Join-Path $packageDir 'bin') -PathType Container)) {
              throw 'Missing packaged bin directory.'
          }

          if (-not (Test-Path -LiteralPath (Join-Path $packageDir 'VERSION') -PathType Leaf)) {
              throw 'Missing packaged VERSION file.'
          }

          if (-not (Test-Path -LiteralPath (Join-Path $packageDir 'app/mods-host/host.js') -PathType Leaf)) {
              throw 'Missing packaged mod host (app/mods-host/host.js).'
          }

          $versionOutput = (& (Join-Path $packageDir 'bin/fleet.cmd') version | Out-String).Trim()
          if ($versionOutput -ne $packageVersion) {
              throw "Smoke test version mismatch. Expected '$packageVersion' but got '$versionOutput'."
          }

          $env:WEAVE_FLEET_HOST = '127.0.0.1'
          $env:WEAVE_FLEET_PORT = $port
          $process = Start-Process -FilePath (Join-Path $packageDir 'bin/fleet.cmd') -RedirectStandardOutput $logPath -RedirectStandardError $errorLogPath -PassThru

          try {
              for ($attempt = 0; $attempt -lt 30; $attempt++) {
                  Start-Sleep -Seconds 1

                  if ($process.HasExited) {
                      if (Test-Path -LiteralPath $logPath) {
                          Get-Content -Path $logPath
                      }

                      if (Test-Path -LiteralPath $errorLogPath) {
                          Get-Content -Path $errorLogPath
                      }

                      throw 'Packaged app exited before health check succeeded.'
                  }

                  try {
                      $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/healthz"
                      if ($response.StatusCode -eq 200) {
                          break
                      }
                  }
                  catch {
                  }

                  if ($attempt -eq 29) {
                      if (Test-Path -LiteralPath $logPath) {
                          Get-Content -Path $logPath
                      }

                      if (Test-Path -LiteralPath $errorLogPath) {
                          Get-Content -Path $errorLogPath
                      }

                      throw 'Packaged app did not become healthy within the timeout.'
                  }
              }
          }
          finally {
              if (-not $process.HasExited) {
                  Stop-Process -Id $process.Id -Force
              }
          }

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/release/*${{ matrix.archive_extension }}
            artifacts/release/*${{ matrix.archive_extension }}.sha256
          if-no-files-found: error
          retention-days: 7
          # A re-run of a failed job uploads again.
          overwrite: true

      - name: Resolve the desktop version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.ci-gate.outputs.tag }}
        run: echo "DESKTOP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      # The very folder the CLI archive was made from and smoke-tested with.
      - name: Package, check and upload the desktop app
        uses: ./.github/actions/package-desktop
        with:
          rid: ${{ matrix.rid }}
          builder-args: ${{ matrix.builder_args }}
          app: ${{ matrix.app }}
          installers: ${{ matrix.installers }}
          version: ${{ env.DESKTOP_VERSION }}
          server-dir: ${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}

      # tar keeps the executable bit, which artifacts drop.
      - name: Keep the server for a re-run
        if: failure() && steps.publish.outcome == 'success'
        shell: bash
        # A relative path: Git for Windows' tar reads "D:\..." as a remote host.
        run: tar -cf artifacts/server.tar -C "artifacts/publish/${{ matrix.rid }}" .

      - name: Upload the server for a re-run
        if: failure() && steps.publish.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.rid }}
          path: artifacts/server.tar
          retention-days: 7
          overwrite: true

  publish:
    # On a dry run this assembles the release exactly as for a tag, then compares it with the latest real release.
    name: ${{ github.event_name == 'push' && 'Publish GitHub Release' || 'Assemble release (dry run, publishes nothing)' }}
    runs-on: ubuntu-latest
    needs: [ci-gate, build]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Merge the Windows update feeds
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          (cd desktop && bun install --frozen-lockfile)
          # x64 first: its installer becomes the feed's fallback `path` for updaters that don't read `files`.
          node desktop/scripts/merge-update-manifests.mjs release-assets/latest.yml \
            release-assets/latest-win-x64.yml release-assets/latest-win-arm64.yml
          rm release-assets/latest-win-*.yml
          ls release-assets/*.yml

      - name: Create merged checksums manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          release_dir = Path('release-assets')
          lines = []

          for checksum_path in sorted(release_dir.glob('*.sha256')):
              content = checksum_path.read_text(encoding='utf-8').strip()
              if content:
                  lines.append(content)

          if not lines:
              raise SystemExit('No checksum files were downloaded.')

          release_dir.joinpath('checksums.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      # Fleet-mac-arm64.dmg and friends, so latest/download/<name> links never change.
      - name: Add installers without the version
        shell: bash
        run: scripts/add-unversioned-installers.sh "${{ needs.ci-gate.outputs.tag }}" release-assets

      - name: Stage installer scripts
        shell: bash
        run: |
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install.ps1 release-assets/install.ps1
          chmod +x release-assets/install.sh

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*

      - name: Compare the dry run with the latest release
        if: github.event_name != 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.ci-gate.outputs.tag }}
          COMPARE_WITH: ${{ inputs.compare_with }}
        run: |
          previous="${COMPARE_WITH:-$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)}"
          ls -la release-assets
          python3 scripts/compare-release-assets.py release-assets "${RELEASE_TAG#v}" "$previous" --report compare.md
          cat compare.md >> "$GITHUB_STEP_SUMMARY"

      # The dry run's small files (update feeds, checksums, comparison) to read; the packages are the run's
      # release-* artifacts already.
      - name: Upload the dry run's release files
        if: github.event_name != 'push' && always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-release-files
          path: |
            release-assets/*.yml
            release-assets/checksums.txt
            compare.md
          if-no-files-found: warn
          retention-days: 7


  deploy-vanity-url:
    name: Deploy vanity URL installer
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    env:
      VANITY_URL_TARGET_REPOSITORY: ${{ vars.VANITY_URL_TARGET_REPOSITORY }}
      VANITY_URL_TARGET_BRANCH: ${{ vars.VANITY_URL_TARGET_BRANCH != '' && vars.VANITY_URL_TARGET_BRANCH || 'gh-pages' }}
      VANITY_URL_DEPLOY_TOKEN: ${{ secrets.VANITY_URL_DEPLOY_TOKEN }}

    steps:
      - name: Check deploy prerequisites
        id: prerequisites
        shell: bash
        run: |
          if [ -z "$VANITY_URL_TARGET_REPOSITORY" ]; then
            echo "::warning::Skipping vanity URL deployment because repository variable VANITY_URL_TARGET_REPOSITORY is not configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$VANITY_URL_DEPLOY_TOKEN" ]; then
            echo "::warning::Skipping vanity URL deployment because secret VANITY_URL_DEPLOY_TOKEN is not configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Check vanity URL branch
        if: steps.prerequisites.outputs.configured == 'true'
        id: branch
        shell: bash
        run: |
          branch_ref=$(git ls-remote --heads "https://x-access-token:${VANITY_URL_DEPLOY_TOKEN}@github.com/${VANITY_URL_TARGET_REPOSITORY}.git" "$VANITY_URL_TARGET_BRANCH")
          if [ -z "$branch_ref" ]; then
            echo "::warning::Skipping vanity URL deployment because ${VANITY_URL_TARGET_REPOSITORY}:${VANITY_URL_TARGET_BRANCH} does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        if: steps.prerequisites.outputs.configured == 'true' && steps.branch.outputs.exists == 'true'
        uses: actions/checkout@v4

      - name: Prepare vanity URL payload
        if: steps.prerequisites.outputs.configured == 'true' && steps.branch.outputs.exists == 'true'
        shell: bash
        run: |
          mkdir -p vanity-url
          cp scripts/install.sh vanity-url/fleet.sh
          chmod +x vanity-url/fleet.sh

      - name: Checkout vanity URL branch
        if: steps.prerequisites.outputs.configured == 'true' && steps.branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VANITY_URL_TARGET_REPOSITORY }}
          ref: ${{ env.VANITY_URL_TARGET_BRANCH }}
          token: ${{ env.VANITY_URL_DEPLOY_TOKEN }}
          path: vanity-pages

      - name: Publish fleet.sh
        if: steps.prerequisites.outputs.configured == 'true' && steps.branch.outputs.exists == 'true'
        shell: bash
        working-directory: vanity-pages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          cp ../vanity-url/fleet.sh ./fleet.sh

          if [ -z "$(git status --short -- fleet.sh)" ]; then
            echo "fleet.sh is already up to date."
            exit 0
          fi

          git add fleet.sh
          git commit -m "Deploy fleet installer for ${RELEASE_TAG}"
          git push origin "HEAD:${VANITY_URL_TARGET_BRANCH}"

  notify-website:
    name: Notify website of Fleet release
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 5
    env:
      WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}

    steps:
      - name: Check website dispatch prerequisites
        id: prerequisites
        shell: bash
        run: |
          if [ -z "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "::warning::Skipping website notification because secret WEBSITE_DISPATCH_TOKEN is not configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Notify weave-website to update Fleet version
        if: steps.prerequisites.outputs.configured == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WEBSITE_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/pgermishuys/weave-website/dispatches \
            -d "{\"event_type\":\"fleet-version-update\",\"client_payload\":{\"version\":\"${version}\"}}"
